<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Face Attendance System</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f2f6fc;
        }


        /* LOGIN BOX */

        .login-box {

            width: 380px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.10);

        }


        /* TITLE */

        h2 {

            text-align: center;

            color: #0d47a1;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 25px;

        }


        /* ERROR */

        .error {

            background: #ffe6e6;

            color: #d00000;

            padding: 10px;

            border-radius: 6px;

            text-align: center;

            margin-bottom: 15px;

            font-size: 14px;

        }


        /* LABEL */

        label {

            display: block;

            margin-bottom: 6px;

            color: #333;

            font-size: 14px;

            font-weight: bold;

        }


        /* INPUT */

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 17px;

            border: 1px solid #ccc;

            border-radius: 6px;

            font-size: 14px;

            outline: none;

        }


        input:focus {

            border-color: #1976d2;

        }


        /* BUTTON */

        button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background: #1976d2;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

        }


        button:hover {

            background: #0d47a1;

        }


        /* BACK */

        .back {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #555;

            text-decoration: none;

            font-size: 14px;

        }


        .back:hover {

            color: #1976d2;

        }


        /* FOOTER */

        .footer {

            text-align: center;

            margin-top: 20px;

            color: #999;

            font-size: 12px;

        }


        /* MOBILE */

        @media (max-width: 450px) {

            .login-box {

                width: 90%;

                padding: 28px 22px;

            }

        }

    </style>

</head>


<body>


<div class="login-box">


    <h2>
        Admin Login
    </h2>


    <p class="subtitle">
        Face Recognition Attendance System
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form method="POST">


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter Username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter Password"
            required
        >


        <button type="submit">
            Login
        </button>


    </form>


    <a
        href="/"
        class="back"
    >
        ← Back to Home
    </a>


    <div class="footer">
        Face Recognition Attendance System
    </div>


</div>


</body>

</html>
