<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registered | Face Attendance System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #1769e8;
            --blue-dark: #0b4fc9;
            --green: #16a34a;
            --green-dark: #15803d;
            --text: #0f172a;
            --muted: #64748b;
        }


        body {

            min-height: 100vh;

            font-family: "Segoe UI", Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px 15px;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(37,99,235,.12),
                    transparent 28%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    rgba(22,163,74,.10),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #eef5ff,
                    #f8fafc,
                    #eaf2ff
                );

            color: var(--text);
        }


        /* ================= CARD ================= */

        .box {

            width: 520px;

            max-width: 100%;

            padding: 38px;

            text-align: center;

            background: rgba(255,255,255,.96);

            border: 1px solid rgba(255,255,255,.9);

            border-radius: 26px;

            box-shadow:
                0 25px 65px rgba(15,23,42,.14);

            position: relative;

            overflow: hidden;
        }


        .box::before {

            content: "";

            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background: rgba(22,163,74,.07);

            top: -130px;
            right: -80px;
        }


        /* ================= SUCCESS ICON ================= */

        .success-icon {

            width: 78px;
            height: 78px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #dcfce7,
                    #f0fdf4
                );

            border: 1px solid #bbf7d0;

            font-size: 38px;

            box-shadow:
                0 12px 30px rgba(22,163,74,.16);

            position: relative;
            z-index: 1;
        }


        /* ================= TITLE ================= */

        h1 {

            color: #15803d;

            font-size: 30px;

            letter-spacing: -.5px;

            position: relative;
            z-index: 1;
        }


        .subtitle {

            margin-top: 8px;

            color: var(--muted);

            font-size: 14px;

            position: relative;
            z-index: 1;
        }


        /* ================= STUDENT INFO ================= */

        .student {

            margin: 27px 0 20px;

            padding: 18px;

            text-align: left;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            border-radius: 15px;

            position: relative;
            z-index: 1;
        }


        .info-row {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 11px 4px;

            border-bottom: 1px solid #e2e8f0;

            font-size: 14px;
        }


        .info-row:last-child {

            border-bottom: none;

            padding-bottom: 3px;
        }


        .info-label {

            color: #64748b;

            font-weight: 600;
        }


        .info-value {

            color: #0f172a;

            font-weight: 750;

            text-align: right;

            word-break: break-word;
        }


        /* ================= MESSAGE ================= */

        .message {

            color: #475569;

            font-size: 14px;

            margin: 18px 0 22px;

            line-height: 1.6;

            position: relative;
            z-index: 1;
        }


        /* ================= BUTTONS ================= */

        .buttons {

            display: flex;

            flex-direction: column;

            gap: 11px;

            position: relative;
            z-index: 1;
        }


        .btn {

            display: flex;

            align-items: center;

            justify-content: center;

            width: 100%;

            padding: 13px 20px;

            text-decoration: none;

            border-radius: 12px;

            color: white;

            font-size: 14px;

            font-weight: 750;

            transition: all .2s ease;

            box-shadow:
                0 9px 20px rgba(15,23,42,.12);
        }


        .capture {

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--blue-dark)
                );

            box-shadow:
                0 11px 24px rgba(37,99,235,.23);
        }


        .capture:hover {

            transform: translateY(-2px);

            box-shadow:
                0 15px 28px rgba(37,99,235,.30);
        }


        .back {

            background: #202a36;
        }


        .back:hover {

            background: #111827;

            transform: translateY(-2px);
        }


        /* ================= FOOTER ================= */

        .footer {

            margin-top: 20px;

            color: #94a3b8;

            font-size: 11px;

            position: relative;
            z-index: 1;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 520px) {

            body {
                padding: 18px 12px;
            }

            .box {

                padding: 27px 18px;

                border-radius: 21px;
            }

            .success-icon {

                width: 68px;
                height: 68px;

                font-size: 32px;
            }

            h1 {

                font-size: 26px;
            }

            .info-row {

                flex-direction: column;

                align-items: flex-start;

                gap: 4px;
            }

            .info-value {

                text-align: left;
            }

        }

    </style>

</head>


<body>


<div class="box">


    <!-- SUCCESS ICON -->

    <div class="success-icon">

        ✓

    </div>


    <!-- TITLE -->

    <h1>
        Student Registered!
    </h1>


    <p class="subtitle">
        Student details have been saved successfully.
    </p>


    <!-- STUDENT DETAILS -->

    <div class="student">


        <div class="info-row">

            <span class="info-label">
                Student ID
            </span>

            <span class="info-value">
                {{ student_id }}
            </span>

        </div>


        <div class="info-row">

            <span class="info-label">
                Student Name
            </span>

            <span class="info-value">
                {{ name }}
            </span>

        </div>


    </div>


    <!-- MESSAGE -->

    <p class="message">

        अब student का face capture करें
        ताकि attendance के लिए face recognition का उपयोग किया जा सके।

    </p>


    <!-- BUTTONS -->

    <div class="buttons">


        <a
            href="/capture/{{ student_id }}"
            class="btn capture"
        >

            📷 Capture Face

        </a>


        <a
            href="/dashboard"
            class="btn back"
        >

            ← Back to Dashboard

        </a>


    </div>


    <div class="footer">

        Face Recognition Attendance System

    </div>


</div>


</body>

</html>
