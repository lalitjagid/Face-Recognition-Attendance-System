<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student | Face Attendance System</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                linear-gradient(135deg, #f4f7fb, #eaf1f9);
            color: #1f2937;
        }

        /* ================= HEADER ================= */

        .header {
            background: linear-gradient(
                135deg,
                #0066ff,
                #0047b3
            );

            color: white;

            padding: 18px 35px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            box-shadow:
                0 4px 15px rgba(0, 55, 150, 0.25);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 45px;
            height: 45px;

            background: rgba(255,255,255,0.15);

            border: 1px solid rgba(255,255,255,0.25);

            border-radius: 12px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 22px;
        }

        .brand-title {
            font-size: 19px;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 12px;
            opacity: 0.85;
            margin-top: 2px;
        }

        .logout {
            background: #dc3545;

            color: white;

            text-decoration: none;

            padding: 10px 18px;

            border-radius: 8px;

            font-weight: 600;

            transition: 0.25s;

            box-shadow:
                0 4px 10px rgba(0,0,0,0.15);
        }

        .logout:hover {
            background: #bb2d3b;
            transform: translateY(-1px);
        }


        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 650px;

            margin: 45px auto;
        }


        /* ================= CARD ================= */

        .box {
            background: rgba(255,255,255,0.96);

            padding: 35px;

            border-radius: 18px;

            border: 1px solid #e2e8f0;

            box-shadow:
                0 12px 35px rgba(15, 23, 42, 0.10);
        }


        /* ================= TITLE ================= */

        .title-section {
            text-align: center;

            margin-bottom: 30px;
        }

        .title-icon {
            width: 62px;
            height: 62px;

            margin: 0 auto 14px;

            border-radius: 16px;

            background:
                linear-gradient(
                    135deg,
                    #0066ff,
                    #0047b3
                );

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 28px;

            box-shadow:
                0 8px 20px rgba(0,102,255,0.25);
        }

        h1 {
            font-size: 27px;
            color: #111827;

            margin-bottom: 7px;
        }

        .subtitle {
            color: #6b7280;
            font-size: 14px;
        }


        /* ================= ERROR ================= */

        .error {
            background: #fff1f2;

            color: #b42318;

            border: 1px solid #fecdd3;

            padding: 12px 15px;

            border-radius: 9px;

            margin-bottom: 20px;

            font-size: 14px;

            text-align: center;
        }


        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-size: 14px;

            font-weight: 600;

            color: #374151;

            margin-bottom: 8px;
        }

        .required {
            color: #dc3545;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 17px;

            color: #6b7280;

            pointer-events: none;
        }

        input {
            width: 100%;

            padding: 13px 14px 13px 43px;

            border: 1px solid #d1d5db;

            border-radius: 10px;

            background: #ffffff;

            color: #111827;

            font-size: 15px;

            outline: none;

            transition: all 0.25s;
        }

        input:focus {
            border-color: #0066ff;

            box-shadow:
                0 0 0 3px rgba(0,102,255,0.10);
        }

        .readonly {
            background: #f1f5f9;

            color: #64748b;

            cursor: not-allowed;
        }

        .readonly:focus {
            border-color: #d1d5db;

            box-shadow: none;
        }

        .field-note {
            font-size: 12px;

            color: #94a3b8;

            margin-top: 6px;
        }


        /* ================= BUTTONS ================= */

        button {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #0066ff,
                    #0047b3
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: all 0.25s;

            box-shadow:
                0 7px 16px rgba(0,102,255,0.20);
        }

        button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 22px rgba(0,102,255,0.28);
        }

        button:active {
            transform: translateY(0);
        }


        /* ================= BACK BUTTON ================= */

        .back {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 7px;

            margin-top: 13px;

            padding: 13px;

            background: #1f2937;

            color: white;

            text-decoration: none;

            border-radius: 10px;

            font-size: 15px;

            font-weight: 600;

            transition: 0.25s;
        }

        .back:hover {
            background: #111827;

            transform: translateY(-1px);
        }


        /* ================= FOOTER INFO ================= */

        .info-box {
            margin-top: 22px;

            padding: 13px 15px;

            border-radius: 10px;

            background: #f8fafc;

            border: 1px solid #e2e8f0;

            color: #64748b;

            font-size: 12px;

            text-align: center;

            line-height: 1.5;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            .header {
                padding: 15px 18px;
            }

            .brand-title {
                font-size: 16px;
            }

            .brand-subtitle {
                font-size: 11px;
            }

            .brand-icon {
                width: 40px;
                height: 40px;
            }

            .logout {
                padding: 8px 13px;
                font-size: 13px;
            }

            .container {
                width: 94%;
                margin: 25px auto;
            }

            .box {
                padding: 24px 20px;
                border-radius: 15px;
            }

            h1 {
                font-size: 23px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<div class="header">

    <div class="brand">

        <div class="brand-icon">
            📷
        </div>

        <div>

            <div class="brand-title">
                Face Attendance System
            </div>

            <div class="brand-subtitle">
                Admin Management Panel
            </div>

        </div>

    </div>


    <a
        href="/logout"
        class="logout">

        Logout

    </a>

</div>



<!-- ================= MAIN ================= -->

<div class="container">

    <div class="box">


        <!-- TITLE -->

        <div class="title-section">

            <div class="title-icon">
                ✏️
            </div>

            <h1>
                Edit Student
            </h1>

            <div class="subtitle">
                Update student information
            </div>

        </div>



        <!-- ERROR -->

        {% if error %}

        <div class="error">

            ⚠️ {{ error }}

        </div>

        {% endif %}



        <!-- FORM -->

        <form method="POST">


            <!-- STUDENT ID -->

            <div class="form-group">

                <label>
                    Student ID
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🆔
                    </span>

                    <input
                        type="text"
                        value="{{ student[0] }}"
                        class="readonly"
                        readonly
                    >

                </div>

                <div class="field-note">
                    Student ID cannot be changed.
                </div>

            </div>



            <!-- NAME -->

            <div class="form-group">

                <label>
                    Student Name
                    <span class="required">*</span>
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        👤
                    </span>

                    <input
                        type="text"
                        name="name"
                        value="{{ student[1] }}"
                        placeholder="Enter student name"
                        required
                    >

                </div>

            </div>



            <!-- ROLL NUMBER -->

            <div class="form-group">

                <label>
                    Roll Number
                    <span class="required">*</span>
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🔢
                    </span>

                    <input
                        type="text"
                        name="roll_no"
                        value="{{ student[2] }}"
                        placeholder="Enter roll number"
                        required
                    >

                </div>

            </div>



            <!-- COURSE -->

            <div class="form-group">

                <label>
                    Course
                    <span class="required">*</span>
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">
                        🎓
                    </span>

                    <input
                        type="text"
                        name="course"
                        value="{{ student[3] }}"
                        placeholder="Enter course"
                        required
                    >

                </div>

            </div>



            <!-- SAVE -->

            <button type="submit">

                💾 &nbsp; Save Changes

            </button>


        </form>



        <!-- BACK -->

        <a
            href="/student/{{ student[0] }}"
            class="back">

            ⬅ &nbsp; Back to Profile

        </a>



        <div class="info-box">

            🔒 Student ID is kept fixed to maintain
            attendance and face-recognition records.

        </div>


    </div>

</div>


</body>

</html>
